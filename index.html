<title>My Reflection</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Outfit',system-ui,sans-serif;background:#0a0e1c;color:#eef2fb;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;background:#0a0e1c url('reflection-bg.jpg') center/cover no-repeat;transform:scale(1.06);filter:saturate(1.12)}
.tint{position:fixed;inset:0;z-index:1;background:radial-gradient(860px 620px at 50% 46%,rgba(10,14,28,.06),rgba(10,14,28,.34) 72%,rgba(10,14,28,.6)),linear-gradient(180deg,rgba(10,14,28,.14),rgba(10,14,28,.3))}
.wrap{position:relative;z-index:2;height:100%;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:432px;text-align:center;background:rgba(9,13,26,.55);backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);border:1px solid rgba(255,255,255,.09);border-radius:24px;padding:42px 36px;box-shadow:0 26px 70px rgba(0,0,0,.5)}
.badge{width:52px;height:52px;border-radius:15px;margin:0 auto 22px;display:grid;place-items:center;background:linear-gradient(150deg,#5182ff,#2f5bd6);box-shadow:0 8px 26px rgba(47,91,214,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.badge svg{width:26px;height:26px;fill:#fff}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#e6b25e;font-weight:600;margin-bottom:10px}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
h1 .g{background:linear-gradient(100deg,#8fb2ff,#f2cd8a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:'Newsreader',serif;font-style:italic;color:#9aa6c4;font-size:15px;margin-bottom:30px}
.lock{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#69749a;margin-bottom:14px}
.lock svg{width:13px;height:13px;fill:#69749a}
form{display:flex;flex-direction:column;gap:12px}
input{font-family:inherit;font-size:16px;color:#eef2fb;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 16px;text-align:center;letter-spacing:.02em;transition:border-color .2s}
input:focus{outline:none;border-color:#5b8cff;background:rgba(91,140,255,.06)}
button{font-family:inherit;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(120deg,#2f5bd6,#5182ff);border:0;border-radius:12px;padding:14px;cursor:pointer;transition:transform .15s,box-shadow .2s;box-shadow:0 6px 18px rgba(47,91,214,.35)}
button:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(47,91,214,.5)}
button:disabled{opacity:.6;cursor:default;transform:none}
.err{min-height:18px;font-size:13px;color:#e07a5f;margin-top:4px;opacity:0;transition:opacity .2s}
.err.show{opacity:1}
.foot{margin-top:26px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#3a4straight}
.foot{color:#495273}
#deckFrame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:5;background:#0a0e1c}
@media (prefers-reduced-motion:no-preference){.badge{animation:fl 3s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}}
</style>
</head>

const b2u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b2u(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
let KEY=null;
window.dlEnc=async function(url,filename,mime){
  try{
    const buf=new Uint8Array(await (await fetch(url)).arrayBuffer());
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},KEY,buf.slice(12));
    const u=URL.createObjectURL(new Blob([pt],{type:mime}));
    const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
  }catch(e){ alert("Could not prepare the download."); }
  return false;
};
const f=document.getElementById("f"),pw=document.getElementById("pw"),err=document.getElementById("err"),btn=document.getElementById("btn");
f.addEventListener("submit",async e=>{
  e.preventDefault(); err.classList.remove("show"); btn.disabled=true; btn.textContent="Unlocking\u2026";
  try{
    const key=await deriveKey(pw.value);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2u(D_IV)},key,b2u(D_CT)); // throws if wrong
    KEY=key;
    const html=new TextDecoder().decode(pt);
    const fr=document.createElement("iframe"); fr.id="deckFrame"; fr.setAttribute("title","My Reflection");
    fr.srcdoc=html; document.getElementById("gate").remove(); document.body.appendChild(fr);
    try{ pw.value=""; }catch(_){}
  }catch(_){
    btn.disabled=false; btn.textContent="Unlock"; err.classList.add("show"); pw.select();
  }
});
</script>
